name: Bug report
description: Report a reproducible problem in Rupelian Player.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Please write in English and remove API keys, cookies, personal paths, and private media before sharing logs.
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version and hardware
      placeholder: Windows 11 x64, GPU model, WebView2 version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the media/container/subtitle type or a public URL when relevant.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots and sanitized logs
